[project]
name = "frappehero"
authors = [
    { name = "Agilasoft Cloud Technologies", email = "info@agilasoft.com" }
]
description = "Graphical permission groups for Frappe. Group users and choose the records they may access."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
]

[project.urls]
Homepage = "https://www.agilasoft.com"
Repository = "https://github.com/agilasoft/frappehero"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"

[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017",
    "E501",
    "UP030",
    "UP031",
    "UP032",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
